  # Absents du graphe de dependances normales (livre). Correctif : remplacer zip-extract (voir issue dediee).
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0009",
